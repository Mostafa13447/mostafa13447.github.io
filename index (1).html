<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free Invoice Generator | Free Online Tools</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#172033;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#101827;color:white;padding:25px 18px;text-align:center}header h1{margin:0 0 6px}main{max-width:1000px;margin:24px auto;padding:0 14px}.panel{background:white;border-radius:14px;padding:24px;box-shadow:0 4px 20px #18243b12;margin-bottom:20px}h2{margin-top:0}label{display:block;font-weight:600;margin-bottom:12px}input,textarea{display:block;width:100%;padding:11px;border:1px solid #b9c5d6;border-radius:7px;margin-top:5px;font:inherit}textarea{min-height:80px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.item{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:10px}.item label{margin:0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button{border:0;border-radius:8px;padding:12px 18px;background:#1662d3;color:white;font:inherit;font-weight:700;cursor:pointer}button.secondary{background:#e7eef8;color:#172033}button.remove{background:#a92b35}.total{text-align:right;font-size:1.6rem;font-weight:800;margin-top:18px}.hint{color:#5d6878;font-size:.9rem}#invoicePrint{display:none}@media(max-width:600px){.grid{grid-template-columns:1fr}.item{grid-template-columns:1fr 1fr}.item label:first-child{grid-column:1/-1}}@media print{body{background:white}header,main{display:none!important}#invoicePrint{display:block!important;padding:12px;font-size:12pt}#invoicePrint table{width:100%;border-collapse:collapse}#invoicePrint th,#invoicePrint td{border-bottom:1px solid #ccc;padding:9px;text-align:left}#invoicePrint .right{text-align:right}}
</style></head><body><header><h1>Free Invoice Generator</h1><p>Create, print, or save invoices as PDF — no signup needed</p></header><main><section class="panel"><h2>Business & customer</h2><div class="grid"><label>Your business name<input id="business" placeholder="Your Business LLC"></label><label>Customer name<input id="customer" placeholder="Customer name"></label><label>Your contact details<textarea id="contact" placeholder="Phone, email, address"></textarea></label><label>Customer details<textarea id="customerDetails" placeholder="Customer address or email"></textarea></label><label>Invoice number<input id="number" value="INV-001"></label><label>Invoice date<input id="date" type="date"></label><label>Due date<input id="due" type="date"></label><label>Tax rate (%)<input id="tax" type="number" min="0" max="100" step="0.01" value="0"></label></div></section><section class="panel"><h2>Items & services</h2><div id="items"></div><button type="button" class="secondary" id="add">+ Add item</button><div class="total" id="total">Total: $0.00</div></section><section class="panel"><label>Payment instructions / notes<textarea id="notes" placeholder="How to pay, thank you note, terms"></textarea></label><div class="actions"><button id="print" type="button">Print / Save as PDF</button><button class="secondary" id="reset" type="button">Clear invoice</button></div><p class="hint">Everything runs in your browser. Your invoice information is not sent to our server. To save a PDF, choose “Save as PDF” in your browser's print dialog.</p></section></main><article id="invoicePrint"></article><script>
const $=id=>document.getElementById(id);const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function addItem(desc='',qty=1,price=0){const row=document.createElement('div');row.className='item';row.innerHTML='<label>Description<input class="desc" placeholder="Labor, materials, etc."></label><label>Quantity<input class="qty" type="number" min="0" step="0.01"></label><label>Unit price ($)<input class="price" type="number" min="0" step="0.01"></label><button type="button" class="remove">Remove</button>';row.querySelector('.desc').value=desc;row.querySelector('.qty').value=qty;row.querySelector('.price').value=price;row.querySelector('.remove').onclick=()=>{row.remove();calc()};row.addEventListener('input',calc);$('items').append(row);calc()}
function amounts(){const lines=[...document.querySelectorAll('.item')].map(r=>({desc:r.querySelector('.desc').value,qty:Number(r.querySelector('.qty').value)||0,price:Number(r.querySelector('.price').value)||0}));const subtotal=lines.reduce((s,r)=>s+r.qty*r.price,0);const rate=Math.min(100,Math.max(0,Number($('tax').value)||0));return {lines,subtotal,rate,tax:subtotal*rate/100,total:subtotal*(1+rate/100)}}
function calc(){$('total').textContent='Total: '+money(amounts().total)}$('add').onclick=()=>addItem();$('tax').addEventListener('input',calc);$('date').value=new Date().toLocaleDateString('en-CA');$('reset').onclick=()=>{if(!confirm('Clear all invoice fields?'))return;document.querySelectorAll('main input:not([type=date]),main textarea').forEach(e=>e.value='');$('tax').value='0';$('items').innerHTML='';addItem();calc()};$('print').onclick=()=>{const a=amounts();const field=id=>esc($(id).value).replace(/\n/g,'<br>');$('invoicePrint').innerHTML=`<h1>INVOICE</h1><h2>${field('business')}</h2><p>${field('contact')}</p><hr><p><strong>Bill to:</strong> ${field('customer')}<br>${field('customerDetails')}</p><p><strong>Invoice #:</strong> ${field('number')} &nbsp; <strong>Date:</strong> ${field('date')} &nbsp; <strong>Due:</strong> ${field('due')}</p><table><thead><tr><th>Description</th><th>Qty</th><th>Unit price</th><th class="right">Amount</th></tr></thead><tbody>${a.lines.map(r=>`<tr><td>${esc(r.desc)}</td><td>${r.qty}</td><td>${money(r.price)}</td><td class="right">${money(r.qty*r.price)}</td></tr>`).join('')}</tbody></table><p class="right">Subtotal: ${money(a.subtotal)}</p><p class="right">Tax (${a.rate}%): ${money(a.tax)}</p><h2 class="right">Total: ${money(a.total)}</h2><p><strong>Notes / payment:</strong><br>${field('notes')}</p>`;window.print()};addItem('Service',1,0);
</script></body></html>
